[package]
name = "flow_core"
version = "0.1.0"
edition = "2021"
authors = ["Flow Speed Link Team"]
description = "High-performance multi-part asynchronous download engine"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1.6"
futures-util = "0.3"
m3u8-rs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
thiserror = "1.0"
tempfile = "3.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl"
] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.10"
