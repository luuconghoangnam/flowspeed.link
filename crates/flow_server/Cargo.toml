[package]
name = "flow_server"
version = "0.1.0"
edition = "2021"
authors = ["Flow Speed Link Team"]
description = "Local IPC & REST API Server for Browser Extensions (Port 15151)"

[dependencies]
flow_core = { path = "../flow_core" }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
single_instance = "1.0"
