[package]
name = "flow_desktop_slint"
version = "0.1.0"
edition = "2021"
description = "Flow Speed Link - 100% Pure Native Rust GUI (Slint Engine)"
default-run = "flow_desktop"

[[bin]]
name = "flow_desktop"
path = "src/main.rs"

[dependencies]
slint = { version = "1.9", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }
flow_core = { path = "../flow_core" }
flow_server = { path = "../flow_server" }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rfd = "0.15"
open = "5.3"
uuid = { version = "1.10", features = ["v4"] }
dirs = "5.0"
axum = "0.7"

[build-dependencies]
slint-build = "1.9"
